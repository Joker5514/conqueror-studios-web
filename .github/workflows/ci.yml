name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Verify Next.js entrypoints
        run: bun run verify:next-entrypoints

      - name: ESLint and browser localhost guard
        run: bun run lint

      - name: Biome lint
        run: bunx --no-install biome ci .

      - name: TypeScript
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun run test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Audit dependencies (fail on high or critical)
        run: bun audit --audit-level=high

  build:
    name: Production build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'next.config.ts', 'postcss.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start production server and run smoke tests
        run: |
          bun run start -- --port 3100 > /tmp/next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/api/health; then break; fi
            sleep 1
          done
          node scripts/smoke-test.mjs http://127.0.0.1:3100 --profile local
        env:
          SMOKE_SUMMARY_FILE: ${{ runner.temp }}/smoke-summary.md

      - name: Publish smoke summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/smoke-summary.md" ]; then cat "$RUNNER_TEMP/smoke-summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "--- next start log (tail) ---"
          tail -n 60 /tmp/next-start.log || true
